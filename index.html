<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polybounce</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: #cfe8ff;
        font-family: system-ui, 'Microsoft JhengHei', sans-serif;
        overflow: hidden;
      }
      #stage {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
      }
      #wrap {
        position: relative;
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: rgba(5, 6, 15, 0.72);
        text-align: center;
      }
      #overlay.show {
        display: flex;
      }
      #overlay h1 {
        margin: 0;
        font-size: 40px;
        text-shadow: 0 0 18px #4fd1ff;
      }
      #overlay p {
        margin: 0;
        font-size: 20px;
      }
      #retry {
        font: inherit;
        font-size: 20px;
        padding: 10px 28px;
        color: #05060f;
        background: #4fd1ff;
        border: 0;
        border-radius: 8px;
        box-shadow: 0 0 18px #4fd1ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="wrap">
        <canvas id="game" width="800" height="800"></canvas>
        <div id="overlay">
          <h1 id="overlay-title"></h1>
          <p id="overlay-text"></p>
          <button id="retry" hidden>再來一局</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
