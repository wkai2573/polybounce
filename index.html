<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polybounce</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: #cfe8ff;
        font-family: system-ui, 'Microsoft JhengHei', sans-serif;
        overflow: hidden;
      }
      :root {
        --panel-w: 200px;
        --panel-gap: 12px;
        /* 面板移到場地下方時預留的高度。 */
        --panel-h: 132px;
      }
      #stage {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--panel-gap);
      }
      /* 場地是正方形，縮放時要扣掉面板所佔的空間：寬螢幕扣寬度，窄螢幕或直向扣高度。 */
      #wrap {
        position: relative;
        flex: none;
        width: min(100vw - var(--panel-w) - var(--panel-gap), 100vh);
        height: min(100vw - var(--panel-w) - var(--panel-gap), 100vh);
      }
      #effects {
        flex: none;
        width: var(--panel-w);
        align-self: flex-start;
        margin-top: var(--panel-gap);
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: 14px;
      }
      #effects h2 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0.1em;
        opacity: 0.6;
      }
      #effects .effect {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        margin-bottom: 4px;
        overflow: hidden;
        border-radius: 4px;
        background: #10142a;
      }
      #effects .effect .bar {
        position: absolute;
        inset: 0 auto 0 0;
        opacity: 0.4;
      }
      #effects .effect > :not(.bar) {
        position: relative;
      }
      #effects .effect .name {
        flex: 1;
      }
      #effects .effect .secs {
        font-variant-numeric: tabular-nums;
      }
      #effects .effect .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
      }
      #effects .effect.self {
        outline: 2px solid #cfe8ff;
        background: #1b2347;
      }
      #effects .effect.dead {
        opacity: 0.55;
        filter: grayscale(1);
      }
      @media (orientation: portrait), (max-width: 760px) {
        #stage {
          flex-direction: column;
          justify-content: flex-start;
        }
        #wrap {
          width: min(100vw, 100vh - var(--panel-h) - var(--panel-gap));
          height: min(100vw, 100vh - var(--panel-h) - var(--panel-gap));
        }
        #effects {
          align-self: auto;
          margin-top: 0;
          width: min(100vw - 2 * var(--panel-gap), 480px);
          height: var(--panel-h);
          overflow-y: auto;
          flex-direction: row;
          flex-wrap: wrap;
          align-content: flex-start;
        }
        #effects section {
          flex: 1 1 200px;
        }
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
      }
      canvas.menu {
        cursor: default;
      }
      #lock-hint {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: none;
        padding: 8px 20px;
        font-size: 20px;
        border-radius: 8px;
        background: rgba(5, 6, 15, 0.8);
        box-shadow: 0 0 14px #4fd1ff;
        pointer-events: none;
      }
      #lock-hint.show {
        display: block;
      }
      #version {
        position: absolute;
        right: 14px;
        bottom: 10px;
        font-size: 14px;
        opacity: 0.5;
      }
      .level-row {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 20px;
      }
      input.level {
        width: 3.5em;
        padding: 6px 10px;
        letter-spacing: 0;
        text-transform: none;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        background: rgba(5, 6, 15, 0.72);
        text-align: center;
      }
      .screen.show {
        display: flex;
      }
      #menu,
      #lobby {
        background: rgba(5, 6, 15, 0.9);
      }
      .screen h1 {
        margin: 0;
        font-size: 40px;
        text-shadow: 0 0 18px #4fd1ff;
      }
      .screen p {
        margin: 0;
        font-size: 20px;
      }
      .screen .error {
        color: #ff8a8a;
        min-height: 1.4em;
        max-width: 80%;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button,
      input {
        font: inherit;
        font-size: 20px;
        border-radius: 8px;
        border: 0;
        padding: 10px 28px;
      }
      button {
        color: #05060f;
        background: #4fd1ff;
        box-shadow: 0 0 18px #4fd1ff;
        cursor: pointer;
      }
      button.secondary {
        background: #8fa4c8;
        box-shadow: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input {
        width: 7em;
        padding: 10px 14px;
        text-align: center;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #cfe8ff;
        background: #11152b;
        outline: 2px solid #3a4470;
      }
      #mute {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 6px 14px;
        font-size: 16px;
        opacity: 0.75;
        box-shadow: none;
      }
      #room-code {
        font-size: 48px;
        letter-spacing: 0.2em;
        text-shadow: 0 0 18px #4fd1ff;
      }
      #players {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 20px;
        min-width: 16em;
      }
      #players li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #11152b;
        border-radius: 8px;
      }
      #players .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        box-shadow: 0 0 10px currentColor;
        background: currentColor;
      }
      #players .me {
        margin-left: auto;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="wrap">
        <canvas id="game" width="800" height="800"></canvas>

        <div id="menu" class="screen show">
          <h1>Polybounce</h1>
          <label class="level-row">起始關卡 <input id="solo-level" class="level" type="number" min="1" max="99" value="1" /></label>
          <button id="solo">單人遊戲</button>
          <button id="create">建立房間</button>
          <div class="row">
            <input id="code" maxlength="8" placeholder="房間碼" autocomplete="off" />
            <button id="join">加入房間</button>
          </div>
          <p id="menu-error" class="error"></p>
          <span id="version"></span>
        </div>

        <div id="lobby" class="screen">
          <p id="lobby-title">房間碼</p>
          <h1 id="room-code"></h1>
          <ul id="players"></ul>
          <label class="level-row" id="lobby-level-row">起始關卡 <input id="lobby-level" class="level" type="number" min="1" max="99" value="1" /></label>
          <p id="lobby-hint"></p>
          <div class="row">
            <button id="start">開始遊戲</button>
            <button id="leave" class="secondary">離開</button>
          </div>
        </div>

        <div id="overlay" class="screen">
          <h1 id="overlay-title"></h1>
          <p id="overlay-text"></p>
          <div class="row">
            <button id="continue" hidden>從本關接關</button>
            <button id="retry" hidden>再來一局</button>
            <button id="back" class="secondary" hidden>回到主選單</button>
          </div>
        </div>
        <div id="lock-hint">點一下畫面鎖定滑鼠</div>
      </div>
      <aside id="effects" aria-label="效果面板"></aside>
    </div>
    <button id="mute" class="secondary" title="切換音效（M）"></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
